<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>룬 순서</title>
<style>
:root{--bg:#0d0b12;--panel:rgba(16,14,24,.92);--line:rgba(255,255,255,.14);--fg:#ece8f4;--dim:#a39db4;--fire:#ff8a3a;--ice:#8fd0ff;--wind:#8fe6a0;--gold:#f0c35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#stat{position:absolute;left:12px;top:10px;width:230px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(0,0,0,.5)}
.bar i{display:block;height:100%}
#hpb i{background:linear-gradient(90deg,#a83246,#ff6b7f)} #shb i{background:#c9cfdb} #xpb{height:5px;margin-top:3px} #xpb i{background:#4fd1c5}
#stxt{font-size:12px;font-weight:700;margin-top:4px;text-shadow:0 1px 3px #000}
#wave{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:15px;font-weight:800;text-shadow:0 2px 6px #000;text-align:center}
#wave small{display:block;font-size:11px;color:var(--dim);font-weight:600}
#runes{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.rn{width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;background:#1a1726}
.rn canvas{width:24px;height:24px;image-rendering:pixelated}
.rn.st{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,195,90,.25);margin-right:8px;position:relative}
.rn.st::after{content:"보관";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold);font-weight:800;white-space:nowrap}
.rn.cur{border-color:#fff;transform:translateY(-4px)}
.rn.cur::after{content:"다음";position:absolute;margin-top:-52px;font-size:10px;color:#fff;font-weight:800}
.rn.reso{animation:pulse .5s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 2px rgba(255,255,255,.2)}to{box-shadow:0 0 12px 4px rgba(255,255,255,.7)}}
#rchg{font-size:12px;color:var(--dim);font-weight:700;padding:0 8px}
#skills{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px}
.sk{width:118px;min-height:70px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:6px 8px;pointer-events:auto;cursor:pointer;position:relative;overflow:hidden}
.sk .k{font-size:10px;color:var(--dim);font-weight:800}
.sk .n{font-size:13px;font-weight:800;margin-top:1px}
.sk .d{font-size:10.5px;line-height:1.35;margin-top:2px;color:var(--dim)}
.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.sk.reso{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}
#help{position:absolute;right:12px;top:10px;font-size:11px;color:var(--dim);line-height:1.6;text-align:right;text-shadow:0 1px 3px #000}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,4,10,.78);z-index:20}
#ov.on{display:flex}
.card{background:#16131f;border:1px solid var(--line);border-radius:16px;padding:22px 26px;max-width:min(620px,92vw);max-height:92vh;overflow:auto;text-align:center;touch-action:pan-y}
.card h1{margin:0 0 6px;font-size:24px} .card p{font-size:13px;line-height:1.7;color:var(--dim);margin:8px 0;text-align:left}
.card b{color:var(--fg)} .btn{background:#f0c35a;border:0;color:#221a06;font-weight:800;border-radius:10px;padding:11px 22px;font-size:15px;cursor:pointer;margin-top:10px;font-family:inherit}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(236,232,244,.35);border:2px solid rgba(255,255,255,.5)}
body.touch #help{display:none}
body.touch #skills{left:auto;right:10px;transform:none;bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.touch .sk{width:104px;min-height:58px;padding:5px 7px} body.touch .sk .d{font-size:9.5px}
body.touch #runes{left:10px;transform:none;bottom:auto;top:64px;padding:4px 7px;gap:4px} body.touch .rn{width:28px;height:28px} body.touch .rn canvas{width:20px;height:20px}
body.touch #stat{width:170px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="stat"><div class="bar" id="hpb"><i></i></div><div class="bar" id="shb" style="height:4px;margin-top:2px"><i></i></div><div class="bar" id="xpb"><i></i></div><div id="stxt"></div></div>
  <div id="wave"></div>
  <div id="help">WASD · 방향키 이동 · 마우스로 조준<br>1 2 3 룬 스킬 · R(스페이스) 교환 / 공명<br>기본 공격은 자동</div>
  <div id="runes"></div>
  <div id="skills"></div>
</div>
<div id="joy"><i></i></div>
<div id="ov"></div>
<script>
(function(){
"use strict";
var $=function(i){ return document.getElementById(i); };
function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function fmt(n){ return Math.round(n).toLocaleString("ko-KR"); }

/* ═══════════ 도트 그림 — 글자 격자 + 팔레트 ('.' 빈칸, 'k' 외곽선) ═══════════ */
var PIXK="#17131f";
function hex2(c){ c=c.replace("#",""); return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]; }
function shade(c,f){ var r=hex2(c); function q(v){ v=Math.round(f<=1?v*f:v+(255-v)*(f-1)); return Math.max(0,Math.min(255,v)); } return "rgb("+q(r[0])+","+q(r[1])+","+q(r[2])+")"; }
function mkSpr(rows,pal){ var h=rows.length, w=rows[0].length, c=document.createElement("canvas"); c.width=w; c.height=h; var g=c.getContext("2d");
  for(var y=0;y<h;y++) for(var x=0;x<rows[y].length;x++){ var ch=rows[y][x]; if(ch===".") continue; g.fillStyle=ch==="k"?PIXK:(pal[ch]||"#f0f"); g.fillRect(x,y,1,1); } return c; }
function scale2x(src){ var w=src.width,h=src.height,a=src.getContext("2d").getImageData(0,0,w,h),d=new Uint32Array(a.data.buffer),c=document.createElement("canvas"); c.width=w*2; c.height=h*2;
  var g=c.getContext("2d"),o=g.createImageData(w*2,h*2),e=new Uint32Array(o.data.buffer); function px(x,y){ return (x<0||y<0||x>=w||y>=h)?0:d[y*w+x]; }
  for(var y=0;y<h;y++) for(var x=0;x<w;x++){ var P=px(x,y),A=px(x,y-1),B=px(x+1,y),C=px(x-1,y),D=px(x,y+1),e0=P,e1=P,e2=P,e3=P;
    if(C===A&&C!==D&&A!==B) e0=A; if(A===B&&A!==C&&B!==D) e1=B; if(D===C&&D!==B&&C!==A) e2=C; if(B===D&&B!==A&&D!==C) e3=D; var i=y*2*w*2+x*2; e[i]=e0; e[i+1]=e1; e[i+w*2]=e2; e[i+w*2+1]=e3; }
  g.putImageData(o,0,0); return c; }
function flipX(s){ var c=document.createElement("canvas"); c.width=s.width; c.height=s.height; var g=c.getContext("2d"); g.translate(s.width,0); g.scale(-1,1); g.drawImage(s,0,0); return c; }
function whiteOf(s){ var c=document.createElement("canvas"); c.width=s.width; c.height=s.height; var g=c.getContext("2d"); g.drawImage(s,0,0); g.globalCompositeOperation="source-in"; g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); return c; }
function pack(c){ return {r:c,l:flipX(c),wr:whiteOf(c),wl:whiteOf(flipX(c))}; }

var HERO={pal:{h:"#5fc4bb",H:"#2f8f8a",s:"#f0c8a0",e:"#1a1622",a:"#2a6f78",c:"#1f5560",b:"#e08a3a",y:"#ffd34a",d:"#3a3040",D:"#5a4634"},
  body:["................","................","................","................",".....kkkkkk.....","....khhhhhhk....","...khhHHHHHHk...","...kHHHHHHHHk...","...kHHssssHHk...","...kHsesssesk...","...kHssssssHk...","....kbbbbbbk....",
        "...kkbbybbbkk...","..kaaaaaaaaaak..","..kacaaaaaacak..","..ksaaaaaaaask..","..kkaaaaaaaakk..","...kaaaaaaaak...","...kcccccccck..."],
  legs:[["....kddkkddk....","....kddkkddk....","....kDDkkDDk....","....kkkkkkkk....","................"],["....kddkkddk....","...kddk..kddk...","...kDDk..kDDk...","...kkkk..kkkk...","................"]]};
var RUNE_PIX={
  fire:{pal:{o:"#ff8a3a",y:"#ffe07a"},rows:["...kk...","..kook..",".kooyok.",".koyyok.","kooyyook","koyyyyok",".koyyok.","..kkkk.."]},
  ice:{pal:{i:"#8fd0ff",w:"#ffffff",I:"#4f8fd0"},rows:["...kk...","..kiik..",".kiwiik.","kiwiiiik","kiiiiIIk",".kiiIIk.","..kIIk..","...kk..."]},
  wind:{pal:{g:"#8fe6a0",G:"#4fb870"},rows:["..kkkk..",".kgGGgk.","kgGkkGgk","kGk.kgGk","kGkkggGk","kgGGGgk.",".kgggk..","..kkk..."]}
};
var MOB_PIX={
  imp:["................","..k..........k..","..kk........kk..","..kakkkkkkkkak..","...kaaaaaaaak...","..kaaeaaaaeaak..","..kaaekaakeaak..","..kaaaaaaaaaak..","..kaakwwwwkaak..","...kaaaaaaaak...","..kkAAAAAAAAkk..",".kakAAAAAAAAkak.",".kk.kAAAAAAk.kk.","....kAAkkAAk....","....kaak.kaak...","....kkkk.kkkk..."],
  wisp:["................","......kkkk......",".....kllllk.....","....klaaaalk....","...klaaaaaalk...","...kaaeaaeaak...","...kaaeaaeaak...","...kaaaaaaaak...","...kaaakkaaak...","...kaaaaaaaak...","...kAaaaaaaAk...","...kAAaaaaAAk...","....kAkAAkAk....","....k.kAAk.k....",".......kk.......","................"],
  brute:["................","....kkkkkkkk....","...kaaaaaaaak...","..kaaeaaaaeaak..","..kaaaaaaaaaak..",".kkkaawwwwaakkk.","kaaakkkkkkkkaaak","kaaakAAAAAAkaaak","kalakAAAAAAkalak","kaakkAAAAAAkkaak","kaak.kAAAAk.kaak","kllk.kAAAAk.kllk",".kk..kAAAAk..kk.","....kaak.kaak...","...klllk.klllk..","...kkkk..kkkk..."],
  warden:["....kkkkkkkk....","...kAAAAAAAAk...","..kAAllllllAAk..","..kAlkkkkkklAk..","..kAlkyyyyklAk..","..kAlkyrryklAk..","..kAlkkkkkklAk..",".kkAAAAAAAAAAkk.","kaakAAAllAAAkaak","kaakAAllllAAkaak","kaakAAAllAAAkaak","kllkAAAAAAAAkllk",".kk.kAAAAAAk.kk.","....kAAkkAAk....","...kaaak.kaaak..","...kkkkk.kkkkk.."]
};
var MOB_EXTRA={e:"#ffffff",w:"#f2ecdc",y:"#ffd34a",r:"#e0465a"};
var PROP_PIX={
  pillar:{pal:{a:"#8a8494",A:"#5e5968",l:"#b4aec0",m:"#4f7a4a"},rows:["..kkkkkkkkkkkk..",".kllllllllllllk.",".klaaaaaaaaaaAk.","..kkkkkkkkkkkk..","...klaaaaaaAk...","...klaaaaaaAk...","...klaamaaaAk...","...klaaaaaaAk...","...klaaaaamAk...","...klaaaaaaAk...","...klamaaaaAk...","...klaaaaaaAk...","..kkkkkkkkkkkk..",".klaaaaaaaaaaAk.",".kAAAAAAAAAAAAk.","..kkkkkkkkkkkk.."]},
  coin:{pal:{y:"#ffd34a",Y:"#c8922a",w:"#fff3b0"},rows:[".kkkk.","kywyYk","kwyyYk","kyyyYk","kyYYYk",".kkkk."]}
};
var SPR={};
function buildSprites(){
  var fr=[0,1].map(function(f){ return mkSpr(HERO.body.concat(HERO.legs[f]),HERO.pal); }); SPR.hero=fr.map(pack);
  SPR.rune={}; Object.keys(RUNE_PIX).forEach(function(k){ SPR.rune[k]=mkSpr(RUNE_PIX[k].rows,RUNE_PIX[k].pal); });
  SPR.mob={}; var cols={imp:"#c8563a",wisp:"#7a8fe0",brute:"#6f8a5a",warden:"#8a7ab8"};
  Object.keys(MOB_PIX).forEach(function(k){ var c=cols[k], s=mkSpr(MOB_PIX[k],Object.assign({a:c,A:shade(c,0.66),l:shade(c,1.45)},MOB_EXTRA)); if(k==="brute"||k==="warden") s=scale2x(s); SPR.mob[k]=pack(s); });
  SPR.prop={}; Object.keys(PROP_PIX).forEach(function(k){ SPR.prop[k]=mkSpr(PROP_PIX[k].rows,PROP_PIX[k].pal); });
}

/* ═══════════ 룬 — 이 게임의 핵심 규칙 ═══════════
   보관 칸 1 + 대기 칸 5. 합쳐서 불·서리·바람이 2개씩. 같은 룬은 바로 이어 나오지 않는다.
   Q·W·E 를 쓰면 대기 맨 앞 룬이 소모되고, 그 룬에 따라 스킬 효과가 바뀐다.
   보관 룬과 맨 앞 룬이 같으면 R 이 '공명' — 둘을 함께 태워 큰 기술. 다르면 R 은 '교환'(보관 ↔ 맨 앞).
   대기 칸을 다 쓰면 잠깐 충전한 뒤 새로 배열된다. */
var RUNES=["fire","ice","wind"], RN={fire:"불",ice:"서리",wind:"바람"}, RCOL={fire:"#ff8a3a",ice:"#8fd0ff",wind:"#8fe6a0"};
var Q={stored:null,act:[],recharge:0};
function deal(){
  if(!Q.stored) Q.stored=RUNES[Math.floor(Math.random()*3)];
  var pool=[]; RUNES.forEach(function(r){ pool.push(r); if(r!==Q.stored) pool.push(r); });
  for(var t=0;t<200;t++){ for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
    var ok=pool[0]!==Q.stored; for(var k=1;k<pool.length&&ok;k++) if(pool[k]===pool[k-1]) ok=false; if(ok) break; }
  Q.act=pool.slice(); Q.recharge=0;
}
function frontRune(){ return Q.act.length?Q.act[0]:null; }
function consume(){ var r=Q.act.shift(); if(!Q.act.length){ Q.recharge=RECHARGE; H.haste=Math.max(H.haste,RECHARGE); } return r; }
function resoMatch(){ return Q.act.length&&Q.stored&&Q.stored===Q.act[0]; }
function canReso(){ return resoMatch()&&H&&H.rs<=0; }
var RECHARGE=1.4, RESO_CD=7;

/* ═══════════ 세계 ═══════════ */
var TS=16, MW=56, MH=38, AW=MW*TS, AH=MH*TS;
var PILLARS=[], GROUND=null;
var H=null, MOBS=[], SHOTS=[], ZONES=[], MARKS=[], FX=[], TXT=[], COINS=[];
var wave=0, waveT=2.5, T0=0, state="title", shake=0, HS=0, best=0;
function newHero(){ return {x:AW/2,y:AH/2,r:5,hp:120,mhp:120,sh:0,shT:0,atk:10,spd:72,face:1,cd:0,q:0,w:0,e:0,r4:0,rs:0,haste:0,lvl:1,exp:0,gold:0,hit:0,moving:false,inv:0}; }
function need(l){ return 20+l*16; }
function buildGround(){
  var c=document.createElement("canvas"); c.width=AW; c.height=AH; var g=c.getContext("2d"), x,y,i;
  function r(){ return Math.random(); }
  for(y=0;y<MH;y++) for(x=0;x<MW;x++){ var edge=x<2||y<2||x>=MW-2||y>=MH-2, b=edge?"#2a2634":"#5b5a66";
    g.fillStyle=b; g.fillRect(x*TS,y*TS,TS,TS);
    for(i=0;i<14;i++){ g.fillStyle=shade(b,r()<0.5?0.9:1.1); g.fillRect(x*TS+(r()*TS|0),y*TS+(r()*TS|0),1,1); }
    if(!edge){ g.fillStyle=shade(b,0.8); g.fillRect(x*TS,y*TS+TS-1,TS,1); g.fillRect(x*TS+TS-1,y*TS,1,TS); g.fillStyle=shade(b,1.14); g.fillRect(x*TS,y*TS,TS-1,1);
      if(r()<0.16){ var mx=x*TS+2+(r()*10|0), my=y*TS+2+(r()*10|0); g.fillStyle="#4f7a4a"; g.fillRect(mx,my,3,2); g.fillStyle="#6f9a5a"; g.fillRect(mx+1,my,1,1); }
      if(r()<0.1){ var kx=x*TS+3+(r()*8|0), ky=y*TS+3+(r()*8|0); g.fillStyle=shade(b,0.66); for(i=0;i<4;i++) g.fillRect(kx+i,ky+(i>>1),1,1); } }
    else if(y===1||y===MH-2||x===1||x===MW-2){ g.fillStyle="#3a3546"; g.fillRect(x*TS,y*TS,TS,TS); g.fillStyle="#262230"; g.fillRect(x*TS,y*TS+5,TS,1); g.fillRect(x*TS,y*TS+11,TS,1); g.fillRect(x*TS+(y%2?4:10),y*TS,1,5); g.fillRect(x*TS+(y%2?10:4),y*TS+6,1,5); } }
  PILLARS=[]; [[14,10],[41,10],[14,27],[41,27],[27,7],[27,30],[8,18],[47,18]].forEach(function(p){ PILLARS.push({x:p[0]*TS+8,y:p[1]*TS+8,r:7}); });
  PILLARS.forEach(function(p){ g.fillStyle="rgba(0,0,0,.3)"; g.fillRect(p.x-8,p.y+6,16,3); });
  GROUND=c;
}
function moveEnt(e,vx,vy){
  e.x=clamp(e.x+vx,2*TS+e.r,AW-2*TS-e.r); e.y=clamp(e.y+vy,2*TS+e.r,AH-2*TS-e.r);
  for(var i=0;i<PILLARS.length;i++){ var p=PILLARS[i], d=Math.hypot(e.x-p.x,e.y-p.y), m=p.r+e.r; if(d<m&&d>0){ e.x=p.x+(e.x-p.x)/d*m; e.y=p.y+(e.y-p.y)/d*m; } }
}
function num(x,y,t,c,s){ TXT.push({x:x+rnd(-4,4),y:y,t:t,c:c,s:s||13,a:0}); }
function ring(x,y,r0,r1,c,life){ FX.push({k:"ring",x:x,y:y,r0:r0,r1:r1,c:c,t:0,life:life||0.35}); }
function boom(x,y,r,c){ FX.push({k:"boom",x:x,y:y,r:r,c:c||"fire",t:0,life:0.4}); }

/* ═══════════ 적 ═══════════ */
var MT={imp:{hp:30,spd:54,dmg:7,r:6,exp:5,gold:2},wisp:{hp:22,spd:34,dmg:10,r:6,exp:6,gold:3,ranged:true},brute:{hp:120,spd:24,dmg:14,r:11,exp:16,gold:8,big:true},warden:{hp:650,spd:30,dmg:16,r:13,exp:120,gold:60,big:true,boss:true}};
function spawn(kind){
  var s=Math.floor(Math.random()*4), x=s===0?3*TS:s===1?AW-3*TS:rnd(3*TS,AW-3*TS), y=s===2?3*TS:s===3?AH-3*TS:rnd(3*TS,AH-3*TS), M=MT[kind], k=1+0.26*(wave-1), d=1+0.13*(wave-1);
  if(dist({x:x,y:y},H)<90){ x=AW-x; y=AH-y; }
  var hp=Math.round(M.hp*k*(M.boss?1+0.5*(wave/5-1):1));
  MOBS.push({k:kind,M:M,x:x,y:y,r:M.r,hp:hp,mhp:hp,dmg:M.dmg*d,cd:rnd(0.5,1.5),frz:0,slow:0,burn:0,burnD:0,hit:0,face:1,pat:null,patCd:3});
}
function startWave(){
  wave++; var boss=wave%5===0, n=boss?4+Math.floor(wave/5)*2:5+Math.floor(wave*1.8);
  if(boss) spawn("warden");
  for(var i=0;i<n;i++){ var r=Math.random(); spawn(wave<2?"imp":r<0.5?"imp":r<0.8||wave<3?"wisp":"brute"); }
  $("wave").innerHTML=(boss?"⚔ ":"")+wave+" 웨이브"+(boss?" — 문지기":"")+"<small>최고 "+Math.max(best,wave)+"</small>";
}
function hurtMob(m,d,col){

/* ═══════════ HUD ═══════════ */
function runeIcon(r){ var c=document.createElement("canvas"); c.width=8; c.height=8; c.getContext("2d").drawImage(SPR.rune[r],0,0); return c; }
var hudKey="";
function hud(){
  if(!H) return;
  $("hpb").firstChild.style.width=(H.hp/H.mhp*100)+"%"; $("shb").firstChild.style.width=(H.sh/H.mhp*100)+"%"; $("xpb").firstChild.style.width=(H.exp/need(H.lvl)*100)+"%";
  $("stxt").innerHTML="체력 "+fmt(H.hp)+" / "+H.mhp+" · 레벨 "+H.lvl+" · <span style='color:var(--gold)'>"+fmt(H.gold)+" G</span>";
  var key=Q.stored+"|"+Q.act.join(",")+"|"+(Q.recharge>0?1:0)+"|"+resoMatch();
  if(key!==hudKey){ hudKey=key; var el=$("runes"); el.innerHTML="";
    var st=document.createElement("div"); st.className="rn st"; if(Q.stored) st.appendChild(runeIcon(Q.stored)); el.appendChild(st);
    Q.act.forEach(function(r,i){ var d=document.createElement("div"); d.className="rn"+(i===0?" cur":"")+(i===0&&resoMatch()?" reso":""); d.appendChild(runeIcon(r)); el.appendChild(d); });
    if(!Q.act.length){ var s=document.createElement("div"); s.id="rchg"; s.textContent="룬을 다시 읽는 중…"; el.appendChild(s); }
    var f=frontRune(), h="";
    ["q","w","e"].forEach(function(k){ h+='<div class="sk" data-k="'+k+'"><div class="k">'+{q:1,w:2,e:3}[k]+'</div><div class="n">'+SKD[k].n+'</div><div class="d">'+(f?'<b style="color:'+RCOL[f]+'">'+RN[f]+'</b> '+SKD[k].d[f]:'—')+'</div><div class="cd"></div></div>'; });
    var rs=resoMatch(); h+='<div class="sk'+(rs?' reso':'')+'" data-k="r"><div class="k">R</div><div class="n">'+(rs?'<span style="color:'+RCOL[Q.stored]+'">공명!</span>':'교환')+'</div><div class="d">'+(rs?SKD.r.reso[Q.stored]:'보관 룬 ↔ 다음 룬<br>둘이 같아지면 공명')+'</div><div class="cd"></div></div>';
    $("skills").innerHTML=h; }
  document.querySelectorAll("#skills .sk").forEach(function(el){ var k=el.getAttribute("data-k"), cd=k==="r"?(resoMatch()?H.rs:H.r4):H[k], c=el.querySelector(".cd"); if(cd>0.05){ c.style.display="flex"; c.textContent=cd.toFixed(cd<1?1:0); } else c.style.display="none"; });
}
$("skills").addEventListener("pointerdown",function(e){ var el=e.target.closest(".sk"); if(!el) return; e.preventDefault(); cast(el.getAttribute("data-k")); });

cv.addEventListener("pointerdown",function(e){ if(e.pointerType==="mouse") return; AIM.on=false; if(JOY.id===null){ JOY.id=e.pointerId; JOY.ox=e.clientX; JOY.oy=e.clientY; JOY.vx=JOY.vy=0; var j=$("joy"); j.style.left=e.clientX+"px"; j.style.top=e.clientY+"px"; j.style.display="block"; j.firstChild.style.transform=""; try{ cv.setPointerCapture(e.pointerId); }catch(er){} } });

/* ═══════════ 화면 ═══════════ */
function showTitle(){
  $("ov").className="on"; $("ov").innerHTML='<div class="card"><h1>룬 순서</h1>'
    +'<p>룬술사는 <b style="color:var(--fire)">불</b> · <b style="color:var(--ice)">서리</b> · <b style="color:var(--wind)">바람</b> 룬을 읽어 싸운다. 룬은 <b>보관 1칸 + 대기 5칸</b>에 무작위 순서로 놓인다.</p>'
    +'<p><b>1 · 2 · 3</b> 어떤 스킬을 쓰든 <b>대기 맨 앞 룬</b>이 소모되고, 그 룬에 따라 스킬 효과가 달라진다 — 불은 큰 피해, 서리는 얼림, 바람은 보조.</p>'
    +'<p><b>R</b>은 보관 룬과 맨 앞 룬을 <b>교환</b>한다. 보관 룬과 맨 앞 룬이 <b>같아지면 R이 공명</b>이 되어 둘을 함께 태우는 큰 기술이 나간다. 같은 룬은 저절로 붙어 나오지 않으니, 순서를 읽고 직접 맞춰야 한다.</p>'
    +'<p style="color:var(--fg)">'+(TOUCH?'왼쪽 화면을 끌어 이동 · 오른쪽 버튼으로 스킬 (가까운 적을 자동 조준)':'WASD 이동 · 마우스 조준 · 1 2 3 스킬 · R 교환/공명 · 기본 공격은 자동')+'</p>'
    +'<button class="btn" id="go">시작</button></div>';
  $("go").onclick=start;

window.__G={H:function(){return H;},Q:Q,MOBS:function(){return MOBS;},cast:cast,start:start,wave:function(){return wave;},state:function(){return state;},KEYS:KEYS,AIM:AIM,SPR:SPR};
